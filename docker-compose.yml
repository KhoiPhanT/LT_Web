# Khởi: MySQL demo và Tomcat Servlet. Lợi: biến môi trường cho OTP email và phiên đăng nhập.
services:
  mysql_db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: hihihaha_simple_db
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_ltweb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_ROOT_PASSWORD}\" mysqladmin ping -h localhost -u root --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend2_servlet:
    build:
      context: ./backend2
      dockerfile: Dockerfile
    depends_on:
      mysql_db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8089}:8080"
    environment:
      TZ: Asia/Ho_Chi_Minh
      DB_HOST: mysql_db
      DB_PORT: 3306
      DB_NAME: hihihaha_simple_db
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      DEMO_MODE: ${DEMO_MODE:-false}
      OTP_TTL_MS: ${OTP_TTL_MS:-300000}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/v1/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
volumes:
  mysql_ltweb_data:
