version: '3.8'

services:
  mysql_db:
    image: mysql:8.0
    container_name: hihihaha_mysql_ltweb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hihihaha_db
    ports:
      - "3306:3306"
    volumes:
      - ./backend2/src/main/resources/database/init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - mysql_ltweb_data:/var/lib/mysql
    networks:
      - ltweb_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend2_servlet:
    build:
      context: ./backend2
      dockerfile: Dockerfile
    container_name: hihihaha_servlet_ltweb
    restart: always
    depends_on:
      mysql_db:
        condition: service_healthy
    ports:
      - "8088:8080"
    environment:
      DB_HOST: mysql_db
      DB_PORT: 3306
      DB_NAME: hihihaha_db
      DB_USER: root
      DB_PASSWORD: root
    networks:
      - ltweb_network

networks:
  ltweb_network:
    driver: bridge

volumes:
  mysql_ltweb_data:
